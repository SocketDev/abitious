# abitious FAST push/PR CI build (the tier-1 subset).
#
# This is the fast feedback build for pushes to main + PRs: it builds only the TIER-1
# targets (native on their runner, no cross C toolchain). A v* tag push builds all eight
# targets and prepares a manifest-bound asset handoff for release-github.yml. npm packages
# remain governed by the separate npm publish workflow and release approval.
#
# The build MATRIX is DERIVED from the single source of truth (scripts/repo/targets.mts) at CI
# time: the `prepare` job runs `gen-packages --print-matrix` (the tier-1 subset) and the
# `build` job consumes it via `fromJSON`, so adding/removing a target in targets.mts changes
# the matrix with no edit here (the cross-language coupling is genuine, never a duplicated
# triple list).
#
# Jobs:
#   • check   — the JS gates + gen-then-check (single-source guard): gen --check, the vitest
#               unit suites, and tsc typecheck.
#   • prepare — emit the tier-1 matrix JSON from targets.mts.
#   • build   — per selected target, build the addon stubs, the FFI self-extractor,
#               and the host `abi` producer. Run `abi pack-ffi` on that target runner.
#   • aggregate — on an all-target dispatch, verify all eight template artifacts from
#                 this workflow SHA and upload a tar archive with a SHA-512 sidecar.
#
# The workflow uses fleet-owned setup, toolchain, cache, and artifact actions.
# Each job bootstraps its checkout inline because a local action cannot run
# before GitHub checks out the repository.

name: 'build: tier-1 native packages'
run-name: 'build: ${{ github.ref_name }}'

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'npm/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - '.github/workflows/build-tier-1-native-packages.yml'
  pull_request:
    paths:
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'npm/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - '.github/workflows/build-tier-1-native-packages.yml'
  workflow_dispatch:
    inputs:
      all-targets:
        description: 'Build every target from targets.mts (release set), not just tier-1.'
        type: boolean
        default: false
      source-sha:
        description: 'Full source SHA selected by a trusted npm publish run.'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: nightly-2026-09-24

jobs:
  # JS gates + the single-source-of-truth guard. No package install is needed for gen/tests
  # (pure node builtins); typecheck installs the pinned devDeps via pnpm.
  check:
    name: Check
    runs-on: ubuntu-26.04
    steps:
      - name: Bootstrap checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_B64}"
          git fetch --no-tags --depth 25 origin "${SOURCE_SHA}"
          git checkout -q --detach FETCH_HEAD
      - name: Set up and install
        uses: ./.github/actions/fleet/setup-and-install
        with:
          checkout: 'false'
          socket-api-token: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }}
          node-version: 24
          payload-token-client-id: ${{ secrets.SOCKET_RELEASE_CLIENT_ID || vars.SOCKET_RELEASE_CLIENT_ID }}
          payload-token-private-key: ${{ secrets.SOCKET_RELEASE_APP_PRIVATE_KEY }}
      - name: Gen-packages --check (out-of-sync with targets.mts fails)
        run: node scripts/repo/gen-packages.mts --check
      - name: Vitest (loader-resolution + codegen unit tests)
        run: pnpm test npm/cli/test
      - name: Typecheck (tsc --noemit)
        run: pnpm run typecheck

  # Derive the CI matrix from the single source of truth.
  prepare:
    name: Prepare
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      allTargets: ${{ steps.gen.outputs.allTargets }}
    steps:
      - name: Bootstrap checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_B64}"
          git fetch --no-tags --depth 25 origin "${SOURCE_SHA}"
          git checkout -q --detach FETCH_HEAD
      - name: Hydrate fleet payload
        uses: ./.github/actions/fleet/checkout
        with:
          checkout: 'false'
          payload-token-client-id: ${{ secrets.SOCKET_RELEASE_CLIENT_ID || vars.SOCKET_RELEASE_CLIENT_ID }}
          payload-token-private-key: ${{ secrets.SOCKET_RELEASE_APP_PRIVATE_KEY }}
      - name: Set up node
        uses: ./.github/actions/fleet/setup
        with:
          node-version: 24
          socket-api-token: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }}
      - id: gen
        name: Derive the tier-1 matrix from targets.mts
        env:
          ALL_TARGETS: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.all-targets }}
          APPLE_DEVELOPER_ID_APPLICATION_CERTS_P12: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTS_P12 }}
          APPLE_DEVELOPER_ID_APPLICATION_CERTS_P12_PASS: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTS_P12_PASS }}
          APPLE_ID: ${{ secrets.APPLE_ID || vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SOURCE_SHA_INPUT: ${{ inputs.source-sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ] && [ "${ALL_TARGETS}" = "true" ] && [ "${SOURCE_SHA_INPUT}" = "${WORKFLOW_SHA}" ]; then
            if [ -z "${APPLE_DEVELOPER_ID_APPLICATION_CERTS_P12}" ] || \
              [ -z "${APPLE_DEVELOPER_ID_APPLICATION_CERTS_P12_PASS}" ] || \
              [ -z "${APPLE_ID}" ] || \
              [ -z "${APPLE_TEAM_ID}" ] || \
              [ -z "${APPLE_APP_SPECIFIC_PASSWORD}" ]; then
              echo "::error::MacOS signing cannot start. Where: native build matrix preparation. Saw at least one required credential missing; wanted all five signing credentials before building targets. Fix: configure the repository secrets and variables, then dispatch again." >&2
              exit 1
            fi
          fi
          if [ -n "${SOURCE_SHA_INPUT}" ] && [ "${SOURCE_SHA_INPUT}" != "${WORKFLOW_SHA}" ]; then
            echo "::error::The selected source SHA does not match this workflow run's source." >&2
            exit 1
          fi
          if [ "$ALL_TARGETS" = "true" ]; then
            matrix="$(node scripts/repo/gen-packages.mts --print-matrix-all)"
          else
            matrix="$(node scripts/repo/gen-packages.mts --print-matrix)"
          fi
          echo "matrix={\"include\":${matrix}}" >> "$GITHUB_OUTPUT"
          echo "allTargets=${ALL_TARGETS:-false}" >> "$GITHUB_OUTPUT"

  # Build each target's producer and self-extractor on its configured runner.
  build:
    name: Build (${{ matrix.triple }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Bootstrap checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_B64}"
          git fetch --no-tags --depth 25 origin "${SOURCE_SHA}"
          git checkout -q --detach FETCH_HEAD
      - name: Hydrate fleet payload
        uses: ./.github/actions/fleet/checkout
        with:
          checkout: 'false'
          payload-token-client-id: ${{ secrets.SOCKET_RELEASE_CLIENT_ID || vars.SOCKET_RELEASE_CLIENT_ID }}
          payload-token-private-key: ${{ secrets.SOCKET_RELEASE_APP_PRIVATE_KEY }}
      - name: Set up node
        uses: ./.github/actions/fleet/setup
        with:
          node-version: 24
          socket-api-token: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }}
      - name: Rust toolchain
        uses: ./.github/actions/fleet/setup-rust-toolchain
        with:
          channel: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust }}
      - name: Rust cache
        uses: ./.github/actions/fleet/setup-rust-cache
        with:
          workspaces: .
          prefix-key: ${{ matrix.triple }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The binder links node.lib (the node.exe import library) on Windows - the win-<arch>
      # dist folders publish it beside node.exe. Node comes from fleet setup.
      - name: Download node.lib (Windows targets only)
        if: ${{ runner.os == 'Windows' }}
        env:
          TARGET_CPU: ${{ matrix.cpu }}
        shell: pwsh
        run: |
          $v = (node -p process.version)
          $arch = if ($env:TARGET_CPU -eq "arm64") { "arm64" } else { "x64" }
          $dir = Join-Path $env:RUNNER_TEMP "node-lib"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest -Uri "https://nodejs.org/dist/$v/win-$arch/node.lib" -OutFile "$dir/node.lib"
          "NODE_LIB_DIR=$dir" | Add-Content $env:GITHUB_ENV
      - name: Build the addon stubs, ffi self-extractor, and abi producer
        env:
          RUST_TARGET: ${{ matrix.rust }}
          TARGET_LIBC: ${{ matrix.libc }}
        run: |
          set -euo pipefail
          cargo_args=(build --locked --release --target "$RUST_TARGET"
            -p abitious-decmpfs -p abitious-bind -p abitious-stub
            -p abitious-ffi-stub -p abitious)
          if [ "$TARGET_LIBC" = musl ]; then
            docker run --rm -v "$PWD:/workspace" -w /workspace \
              -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
              -e RUST_TOOLCHAIN -e CARGO_TERM_COLOR -e RUST_BACKTRACE \
              -e CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=gcc \
              -e CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=gcc \
              rust:alpine@sha256:0cce0a5e0e8ba67b455257a3a02a1d99005f382748789d6464460028810f1627 \
              sh -ec 'rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal; exec rustup run "$RUST_TOOLCHAIN" cargo "$@"' \
              sh "${cargo_args[@]}"
          else
            cargo "${cargo_args[@]}"
          fi
      - name: Copy native outputs into the platform package
        env:
          TRIPLE: ${{ matrix.triple }}
          RUST_TARGET: ${{ matrix.rust }}
          STUB_ARTIFACT: ${{ matrix.stubArtifact }}
          BIND_ARTIFACT: ${{ matrix.bindArtifact }}
          FFI_STUB_ARTIFACT: ${{ matrix.ffiStubArtifact }}
          FFI_ARTIFACT: ${{ matrix.ffiArtifact }}
          BIN: ${{ matrix.bin }}
        run: |
          set -euo pipefail
          node scripts/repo/gen-packages.mts
          dest="npm/${TRIPLE}"
          out="target/${RUST_TARGET}/release"
          cp "${out}/${STUB_ARTIFACT}" "${dest}/stub.node"
          cp "${out}/${BIND_ARTIFACT}" "${dest}/bind.node"
          cp "${out}/${FFI_ARTIFACT}" "${dest}/${FFI_ARTIFACT}"
          cp "${out}/${BIN}" "${dest}/${BIN}"
          cp LICENSE "${dest}/LICENSE"
          cp docs/third-party-notices.md "${dest}/THIRD-PARTY-NOTICES.md"
      - name: Developer id sign and notarize darwin release files
        if: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.all-targets && inputs.source-sha == github.sha)) && startsWith(matrix.triple, 'darwin-') }}
        env:
          TRIPLE: ${{ matrix.triple }}
          RUST_TARGET: ${{ matrix.rust }}
          FFI_STUB_ARTIFACT: ${{ matrix.ffiStubArtifact }}
          SOURCE_SHA: ${{ github.sha }}
          APPLE_DEVELOPER_ID_APPLICATION_CERTS_P12: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTS_P12 }}
          APPLE_DEVELOPER_ID_APPLICATION_CERTS_P12_PASS: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTS_P12_PASS }}
          APPLE_ID: ${{ secrets.APPLE_ID || vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p .cache/fleet/macos-signing
          node scripts/repo/sign-ffi-release.mts \
            --target "${TRIPLE}" \
            --package "npm/${TRIPLE}" \
            --template "target/${RUST_TARGET}/release/${FFI_STUB_ARTIFACT}" \
            --producer-sha "${SOURCE_SHA}" \
            --out ".cache/fleet/macos-signing/${TRIPLE}.json"
      - name: Stage and load the matching ffi template
        env:
          TRIPLE: ${{ matrix.triple }}
          RUST_TARGET: ${{ matrix.rust }}
          FFI_STUB_ARTIFACT: ${{ matrix.ffiStubArtifact }}
          FFI_ARTIFACT: ${{ matrix.ffiArtifact }}
          LIBC: ${{ matrix.libc }}
          BIN: ${{ matrix.bin }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          dest="npm/${TRIPLE}"
          out="target/${RUST_TARGET}/release"
          part=".cache/fleet/ffi-source-part"
          smoke=".cache/fleet/ffi-template-smoke/${TRIPLE}"
          mkdir -p "${smoke}"
          node scripts/repo/ffi-templates.mts stage \
            --target "${TRIPLE}" \
            --package "${dest}" \
            --template "${out}/${FFI_STUB_ARTIFACT}" \
            --producer-sha "${SOURCE_SHA}" \
            --out "${part}"
          signing_receipt=".cache/fleet/macos-signing/${TRIPLE}.json"
          if [ -f "${signing_receipt}" ]; then
            cp "${signing_receipt}" "${part}/macos-signing.json"
          fi
          producer=("${dest}/${BIN}")
          if [ "${LIBC}" = "musl" ]; then
            producer=(docker run --rm -v "$PWD:/workspace" -w /workspace node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1 "/workspace/${dest}/${BIN}")
          fi
          "${producer[@]}" pack-ffi "${dest}/${FFI_ARTIFACT}" \
            --target "${TRIPLE}" \
            --template "${part}/template/ffi-stub.node" \
            --out "${smoke}/packed.node"
          smoke_node=(node)
          if [ "${LIBC}" = "musl" ]; then
            smoke_node=(docker run --rm -v "$PWD:/workspace" -w /workspace node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1 node)
            carrier="/workspace/${smoke}/packed.node"
            input="/workspace/${dest}/${FFI_ARTIFACT}"
          else
            carrier="${smoke}/packed.node"
            input="${dest}/${FFI_ARTIFACT}"
          fi
          "${smoke_node[@]}" --input-type=commonjs -e '
            const assert = require("node:assert/strict");
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const path = require("node:path");
            const carrier = path.resolve(process.argv[1]);
            const input = process.argv[2];
            const addon = require(carrier);
            assert.equal(typeof addon.libraryPath, "string");
            const hash = file => crypto.createHash("sha512").update(fs.readFileSync(file)).digest("hex");
            assert.equal(hash(addon.libraryPath), hash(input));
          ' "${carrier}" "${input}"
          ls -la "${dest}"
      - name: Upload artifact
        uses: ./.github/actions/fleet/upload-artifact
        with:
          name: abitious-ffi-source-${{ matrix.triple }}
          path: .cache/fleet/ffi-source-part
          if-no-files-found: error
      - name: Save Rust cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/fleet/setup-rust-cache
        with:
          phase: save

  aggregate:
    name: Aggregate complete producer bundles
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.allTargets == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Bootstrap checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_B64}"
          git fetch --no-tags --depth 25 origin "${SOURCE_SHA}"
          git checkout -q --detach FETCH_HEAD
      - name: Hydrate fleet payload
        uses: ./.github/actions/fleet/checkout
        with:
          checkout: 'false'
          payload-token-client-id: ${{ secrets.SOCKET_RELEASE_CLIENT_ID || vars.SOCKET_RELEASE_CLIENT_ID }}
          payload-token-private-key: ${{ secrets.SOCKET_RELEASE_APP_PRIVATE_KEY }}
      - name: Set up node
        uses: ./.github/actions/fleet/setup
        with:
          node-version: 24
          socket-api-token: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }}
      - name: Download template parts from this workflow run
        uses: ./.github/actions/fleet/download-artifact
        with:
          path: .cache/fleet/ffi-template-parts
      - name: Verify and assemble platform producer bundles
        env:
          SOURCE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ALL_TARGETS: ${{ inputs.all-targets }}
          SOURCE_SHA_INPUT: ${{ inputs.source-sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          aggregate_args=()
          if [[ "${GITHUB_EVENT_NAME}" = "push" && "${GITHUB_REF}" == refs/tags/v* ]] || [[ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" && "${GITHUB_REF}" = "refs/heads/${DEFAULT_BRANCH}" && "${ALL_TARGETS}" = "true" && "${SOURCE_SHA_INPUT}" = "${SOURCE_SHA}" ]]; then
            aggregate_args+=(--require-macos-signing)
          fi
          node scripts/repo/ffi-templates.mts aggregate \
            --parts .cache/fleet/ffi-template-parts \
            --producer-sha "${SOURCE_SHA}" \
            --out .cache/fleet/ffi-producer-bundles \
            "${aggregate_args[@]}"
          host_bundle=.cache/fleet/ffi-producer-bundles/linux-x64-gnu
          "${host_bundle}/abi" pack-ffi \
            "${host_bundle}/libabitious_decmpfs.so" \
            --target linux-x64-gnu \
            --out .cache/fleet/packed-ffi-smoke.node
          node --input-type=commonjs -e '
            const assert = require("node:assert/strict");
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const path = require("node:path");
            const carrier = require(path.resolve(process.argv[1]));
            const hash = file => crypto.createHash("sha512").update(fs.readFileSync(file)).digest("hex");
            assert.equal(typeof carrier.libraryPath, "string");
            assert.equal(hash(carrier.libraryPath), hash(process.argv[2]));
          ' .cache/fleet/packed-ffi-smoke.node "${host_bundle}/libabitious_decmpfs.so"
          tar -czf .cache/fleet/abitious-ffi-producer-bundles.tar.gz \
            -C .cache/fleet ffi-producer-bundles
          (
            cd .cache/fleet
            shasum -a 512 abitious-ffi-producer-bundles.tar.gz \
              > abitious-ffi-producer-bundles.tar.gz.sha512
            stat -c 'FFI producer bundle: %s bytes' \
              abitious-ffi-producer-bundles.tar.gz
          )
      - name: Prepare tag release asset handoff
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        id: release-assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ASSETS: |
            .cache/fleet/abitious-ffi-producer-bundles.tar.gz
            .cache/fleet/abitious-ffi-producer-bundles.tar.gz.sha512
        run: node scripts/fleet/release/github/assets.mts --prepare
      - name: Expose artifact-service runtime
        uses: ./.github/actions/fleet/expose-actions-runtime
      - name: Upload complete producer bundles
        env:
          RETENTION_DAYS: '400'
        run: |
          set -euo pipefail
          node scripts/fleet/artifact/upload.mts \
            --name abitious-ffi-producer-bundles \
            --path .cache/fleet/abitious-ffi-producer-bundles.tar.gz \
            --path .cache/fleet/abitious-ffi-producer-bundles.tar.gz.sha512 \
            --retention-days "${RETENTION_DAYS}"
      - name: Upload manifest-bound release handoff
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          RELEASE_ASSET_PATH: ${{ steps.release-assets.outputs.path }}
        run: |
          set -euo pipefail
          node scripts/fleet/artifact/upload.mts \
            --name github-release-assets \
            --path "${RELEASE_ASSET_PATH}"
