# abitious FAST push/PR CI build (the tier-1 subset).
#
# This is the fast feedback build for pushes to main + PRs: it builds only the TIER-1
# targets (native on their runner, no cross C toolchain). The full, all-target RELEASE
# build (incl. musl + Windows) that ships tarballs to a GitHub Release lives in
# github-release.yml, and the npm platform packages are built + published by
# npm-publish.yml — so this workflow does NOT trigger on `release: published`.
#
# The build MATRIX is DERIVED from the single source of truth (scripts/repo/targets.mts) at CI
# time: the `prepare` job runs `gen-packages --print-matrix` (the tier-1 subset) and the
# `build` job consumes it via `fromJSON`, so adding/removing a target in targets.mts changes
# the matrix with no edit here (the cross-language coupling is genuine, never a duplicated
# triple list).
#
# Jobs:
#   • check   — the JS gates + gen-then-check (single-source guard): gen --check, the vitest
#               unit suites, and tsc typecheck.
#   • prepare — emit the tier-1 matrix JSON from targets.mts.
#   • build   — per tier-1 target, cross-build the generic stub cdylib + the host `abi`
#               producer and package them into the @abitious/<triple> layout; upload as an
#               artifact. Darwin targets run on macOS runners so the host `abi` producer
#               (which ad-hoc re-signs injected Mach-O via apple-codesign at
#               `abi build --compress` time) is itself a macOS build, and the darwin stub
#               links against the macOS SDK.
#
# Every action is pinned to a commit SHA (SocketDev sha_pinning_required), copied from the
# fleet's canonical pins (decmpfs for the JS actions, envrypt for the Rust actions).

name: 'build: tier-1 native packages'
run-name: 'build: ${{ github.ref_name }}'

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'npm/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - '.github/workflows/build-tier-1-native-packages.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'npm/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - '.github/workflows/build-tier-1-native-packages.yml'
  workflow_dispatch:
    inputs:
      all-targets:
        description: 'Build every target from targets.mts (release set), not just tier-1.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # JS gates + the single-source-of-truth guard. No package install is needed for gen/tests
  # (pure node builtins); typecheck installs the pinned devDeps via pnpm.
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Set up and install
        uses: ./.github/actions/fleet/setup-and-install
        with:
          node-version: 24
          payload-token-client-id: ${{ secrets.SOCKET_RELEASE_CLIENT_ID || vars.SOCKET_RELEASE_CLIENT_ID }}
          payload-token-private-key: ${{ secrets.SOCKET_RELEASE_APP_PRIVATE_KEY }}
      - name: Gen-packages --check (out-of-sync with targets.mts fails)
        run: node scripts/repo/gen-packages.mts --check
      - name: Vitest (loader-resolution + codegen unit tests)
        run: pnpm test npm/cli/test
      - name: Typecheck (tsc --noemit)
        run: pnpm run typecheck

  # Derive the CI matrix from the single source of truth.
  prepare:
    name: Prepare
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No `cache:` input is set, so setup-node does not cache here; the release-trigger
      # cache-poisoning heuristic is a low-confidence false positive.
      - name: Set up node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
        env:
          ALL_TARGETS: ${{ inputs.all-targets }}
      - id: gen
        name: Derive the tier-1 matrix from targets.mts
        run: |
          set -euo pipefail
          if [ "${{ inputs.all-targets }}" = "true" ]; then
            matrix="$(node scripts/repo/gen-packages.mts --print-matrix-all)"
          else
            matrix="$(node scripts/repo/gen-packages.mts --print-matrix)"
          fi
          echo "matrix={\"include\":${matrix}}" >> "$GITHUB_OUTPUT"

  # Cross-build the stub cdylib + host producer per target and package the @abitious/<triple>.
  build:
    name: Build (${{ matrix.triple }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No `cache:` input is set, so setup-node does not cache here; the release-trigger
      # cache-poisoning heuristic is a low-confidence false positive.
      - name: Set up node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      # Toolchain channel is pinned in rust-toolchain.toml (nightly-2026-07-12); keep the
      # `toolchain:` here in lockstep with it. `targets:` adds the matrix cross target.
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-12)
        with:
          toolchain: nightly-2026-07-12
          targets: ${{ matrix.rust }}
      # save-if below is the real mitigation (only a push to main populates the shared
      # cache, so a PR or the privileged `release` run can neither poison it nor bake a
      # poisoned entry into a release); the restore-side heuristic is acknowledged here.
      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 # zizmor: ignore[cache-poisoning] (2026-03-12)
        with:
          key: ${{ matrix.triple }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the musl toolchain (musl targets only)
        if: ${{ matrix.libc == 'musl' }}
      # The binder links node.lib (the node.exe import library) on Windows - the win-<arch>
      # dist folders publish it beside node.exe. Node version comes from setup-node.
      - name: Download node.lib (Windows targets only)
        if: ${{ runner.os == 'Windows' }}
        env:
          TARGET_CPU: ${{ matrix.cpu }}
          WORKSPACE: ${{ github.workspace }}
        shell: pwsh
        run: |
          $v = (node -p process.version)
          $arch = if ($env:TARGET_CPU -eq "arm64") { "arm64" } else { "x64" }
          $dir = "$env:WORKSPACE/.cache/node-lib"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest -Uri "https://nodejs.org/dist/$v/win-$arch/node.lib" -OutFile "$dir/node.lib"
          "NODE_LIB_DIR=$dir" | Add-Content $env:GITHUB_ENV
      - name: Build the generic stub cdylib + the host abi producer
        env:
          RUST_TARGET: ${{ matrix.rust }}
        run: |
          set -euo pipefail
          cargo build -p abitious-decmpfs --release --target "$RUST_TARGET"
          cargo build -p abitious-bind --release --target "$RUST_TARGET"
          cargo build -p abitious-stub --release --target "$RUST_TARGET"
          cargo build -p abitious --release --target "$RUST_TARGET"
      - name: Stage the @abitious/${{ matrix.triple }} package
        env:
          TRIPLE: ${{ matrix.triple }}
          RUST_TARGET: ${{ matrix.rust }}
          STUB_ARTIFACT: ${{ matrix.stubArtifact }}
          BIND_ARTIFACT: ${{ matrix.bindArtifact }}
          FFI_ARTIFACT: ${{ matrix.ffiArtifact }}
          BIN: ${{ matrix.bin }}
        run: |
          set -euo pipefail
          node scripts/repo/gen-packages.mts
          dest="npm/${TRIPLE}"
          out="target/${RUST_TARGET}/release"
          cp "${out}/${STUB_ARTIFACT}" "${dest}/stub.node"
          cp "${out}/${BIND_ARTIFACT}" "${dest}/bind.node"
          cp "${out}/${FFI_ARTIFACT}" "${dest}/${FFI_ARTIFACT}"
          cp "${out}/${BIN}" "${dest}/${BIN}"
          ls -la "${dest}"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (2026-04-10)
        with:
          name: abitious-${{ matrix.triple }}
          path: npm/${{ matrix.triple }}
          if-no-files-found: error
